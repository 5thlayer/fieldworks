modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Library's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Soft: the map markers draw through FTB Chunks' icon API.
[[dependencies.${mod_id}]]
modId = "ftbchunks"
type = "optional"
versionRange = "[26.1.2.8,)"
ordering = "NONE"
side = "CLIENT"

# Soft: an ore block's amount shows in Jade.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

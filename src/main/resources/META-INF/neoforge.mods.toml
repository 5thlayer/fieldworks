modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Library's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

# Superflat worlds place the patches and oil fields too.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Required, and never nested: the Harvester is a Groundworks footprint. The range is upstream('groundworks')
# in build.gradle, capped below the next minor, which may move Footprint.
[[dependencies.${mod_id}]]
modId = "groundworks"
type = "required"
versionRange = "${groundworks_range}"
ordering = "NONE"
side = "BOTH"

# libworks-runtime, nested by jar-in-jar: the Harvester's item handler routes through its guarded face.
# The range is the one libworks { runtime } in build.gradle nests, to the next minor: move both together.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "[0.1.0,0.2)"
ordering = "NONE"
side = "BOTH"

# Soft: the map markers draw through FTB Chunks' icon API.
[[dependencies.${mod_id}]]
modId = "ftbchunks"
type = "optional"
versionRange = "[26.1.2.8,)"
ordering = "NONE"
side = "CLIENT"

# Soft: an ore block's amount shows in Jade.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Soft: Harvest Recipes show in EMI, and its transfer sets a Harvester's Held recipe.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

# Soft: Harvest Recipes show in JEI, and its transfer sets a Harvester's Held recipe.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[29.20.0.53,)"
ordering = "NONE"
side = "CLIENT"

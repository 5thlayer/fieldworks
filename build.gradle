// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.2'
}

// What the Module requires of the other Modules, each as a range whose lower bound is a released
// version: the one it is built and run against and the one CI builds from its tag. neoforge.mods.toml
// names each as ${<name>_range}. Fieldworks' own tags are fieldworks-v<version>, the plugin's default.
libworks {
    // Required, and never jar-in-jar: every Consumer and the Pack share one Groundworks. Capped below
    // the next minor, 0.6, which may move Footprint.
    upstream('groundworks') {
        tagPrefix = 'v'
        range = '[0.5.5,0.6)'
    }
    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range,
    // which runs to the next minor.
    runtime = '0.1.9'
}

def ftbChunks = 'curse.maven:ftb-chunks-314906:8791100'
def ftbLibrary = 'curse.maven:ftb-library-404465:8574542'
def ftbTeams = 'curse.maven:ftb-teams-404468:8074003'
def jade = 'maven.modrinth:jade:26.1.11+neoforge'
// No official EMI for 26.1: this unofficial port is what the 5thlayer mods build against.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'
// The last JEI that loads on NeoForge 26.1.2.77; later ones need .81.
def jei = '29.20.0.53'

// Mods on the dev client that the published jar does not depend on. The game tests run on a source set
// of their own, with no code and the Module's dependencies but not these, so they prove the Module
// plays alone with Groundworks (#20).
sourceSets {
    solo
}

configurations {
    soloRuntimeOnly.extendsFrom implementation, runtimeOnly, libworksGametest
}

neoForge {
    runs {
        configureEach {
            // EMI's port still marks classes @OnlyIn, for which NeoForge stops each load at a warning screen.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        gameTestServer {
            sourceSet = sourceSets.solo
        }
    }

    addModdingDependenciesTo sourceSets.solo
}

repositories {
    // FTB Chunks, which the map markers draw on; the Module loads without it.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade, which shows an ore block's amount; the Module loads without it.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JEI, whose Harvest Recipe tab and transfer the Module adds; it loads without it.
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    // Both soft: their code is reached only from classes that load when the mod is present.
    compileOnly(ftbChunks) { transitive = false }
    compileOnly(ftbLibrary) { transitive = false }
    // On the dev client too, so the patches' markers show; FTB Chunks requires FTB Teams.
    localRuntime(ftbChunks) { transitive = false }
    localRuntime(ftbLibrary) { transitive = false }
    localRuntime(ftbTeams) { transitive = false }
    // And Jade, for an ore block's amount and the Harvester's status.
    localRuntime jade
    compileOnly jade

    // EMI and JEI, both soft: only compat/emi and compat/jei name them, and each viewer loads its plugin only
    // when it is installed (#10). EMI is on the dev client; -PwithJEI puts JEI there instead, as a pack ships one.
    compileOnly emi
    compileOnly "mezz.jei:jei-26.1.2-common-api:$jei"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:$jei"
    if (providers.gradleProperty('withJEI').isPresent()) {
        localRuntime "mezz.jei:jei-26.1.2-neoforge:$jei"
    } else {
        localRuntime emi
    }

    // DataFixerUpper and Gson, and nothing of Minecraft: Codec and the frozen data read on a plain JVM.
    testImplementation 'com.mojang:datafixerupper:9.0.19'
    testImplementation 'com.google.code.gson:gson:2.13.2'
}

// The JUnit tests run on a plain JVM, with no Minecraft on their classpath: they test the rules
// that read no game state, and the game tests test the rest.

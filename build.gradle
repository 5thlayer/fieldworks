plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = maven_group
version = mod_version
base.archivesName = archives_name

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// The Minecraft version goes in the jar's name and not in the Library's version:
// fieldworks-26.1.2-0.1.0.jar.
tasks.withType(Jar).configureEach {
    archiveVersion = "$minecraft_version-$mod_version"
}

def ftbChunks = 'curse.maven:ftb-chunks-314906:8791100'
def ftbLibrary = 'curse.maven:ftb-library-404465:8574542'
def ftbTeams = 'curse.maven:ftb-teams-404468:8074003'
def jade = 'maven.modrinth:jade:26.1.11+neoforge'
// No official EMI for 26.1: this unofficial port is what the 5thlayer mods build against.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'
// The last JEI that loads on NeoForge 26.1.2.77; later ones need .81.
def jei = '29.20.0.53'

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml').get().asFile

// Mods on the dev client that the published jar does not depend on. The game tests run on a source set
// of their own, with no code and the Library's dependencies but not these, so they prove the Library
// plays alone with Groundworks (#20).
sourceSets {
    solo
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    soloRuntimeOnly.extendsFrom implementation, runtimeOnly
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            // EMI's port still marks classes @OnlyIn, for which NeoForge stops each load at a warning screen.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
        // The same player every launch, so a dev save keeps its inventory and position.
        client {
            client()
            programArguments.addAll '--username', 'Developer', '--uuid', '123456781234123412341234567890ab'
            // -PquickPlay=<save> opens that save straight from launch (the skillworks:quicklaunch skill).
            programArguments.addAll providers.gradleProperty('quickPlay').map { ['--quickPlaySingleplayer', it] }.orElse([])
        }
        // Runs the Library's game tests headless and exits, non-zero if any fails. 26.1 has no
        // namespace property, so the selector is what keeps vanilla's tests out.
        // A directory of its own, so nothing the dev client loads or saves reaches it.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.solo
            gameDirectory = project.file('run/gametest')
            programArguments.addAll '--tests', "${mod_id}:*", '--report', gameTestReport.absolutePath
            // What only the game tests stand on, which only this run turns on: a datapack of recipes in
            // the jar, and a fluid-handler block.
            systemProperty 'fieldworks.gametestPack', 'true'
        }
    }

    addModdingDependenciesTo sourceSets.solo

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// The server says only how many tests passed, so the report is read back to name them: a green
// run that didn't run a test is no evidence for it. The report, not the exit code, decides, so a
// failing run still names its tests; a server that crashes writes no report and fails here too.
// The server writes the report but not its folder, which a clean checkout has yet to make.
tasks.named('runGameTestServer') {
    ignoreExitValue = true
    doFirst {
        gameTestReport.delete()
        gameTestReport.parentFile.mkdirs()
    }
    doLast {
        if (!gameTestReport.exists()) throw new GradleException("The game test server wrote no report at $gameTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(gameTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} game tests failed")
    }
}

repositories {
    // FTB Chunks, which the map markers draw on; the Library loads without it.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade, which shows an ore block's amount; the Library loads without it.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JEI, whose Harvest Recipe tab and transfer the Library adds; it loads without it.
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    // Groundworks and libworks-runtime, from the local maven only, where their releases publish them.
    // CI builds their tags there first.
    mavenLocal {
        content {
            includeModule 'io.github.5thlayer', 'groundworks'
            includeModule 'io.github.5thlayer', 'libworks-runtime'
        }
    }
}

dependencies {
    // Required, and never jar-in-jar: every Consumer and the Pack share one Groundworks. The least the
    // Library accepts at load is the one it is built against, capped below the next minor (0.6).
    implementation "io.github.5thlayer:groundworks:$groundworks_version"

    // Nested by jar-in-jar, so players install nothing more; FML loads the newest nested copy in range.
    jarJar(implementation('io.github.5thlayer:libworks-runtime')) {
        version { strictly "[$libworks_runtime_version,1.0)"; prefer libworks_runtime_version }
    }

    // Both soft: their code is reached only from classes that load when the mod is present.
    compileOnly(ftbChunks) { transitive = false }
    compileOnly(ftbLibrary) { transitive = false }
    // On the dev client too, so the patches' markers show; FTB Chunks requires FTB Teams.
    localRuntime(ftbChunks) { transitive = false }
    localRuntime(ftbLibrary) { transitive = false }
    localRuntime(ftbTeams) { transitive = false }
    // And Jade, for an ore block's amount and the Harvester's status.
    localRuntime jade
    compileOnly jade

    // EMI and JEI, both soft: only compat/emi and compat/jei name them, and each viewer loads its plugin only
    // when it is installed (#10). EMI is on the dev client; -PwithJEI puts JEI there instead, as a pack ships one.
    compileOnly emi
    compileOnly "mezz.jei:jei-26.1.2-common-api:$jei"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:$jei"
    if (providers.gradleProperty('withJEI').isPresent()) {
        localRuntime "mezz.jei:jei-26.1.2-neoforge:$jei"
    } else {
        localRuntime emi
    }

    // DataFixerUpper and Gson, and nothing of Minecraft: Codec and the frozen data read on a plain JVM.
    testImplementation 'com.mojang:datafixerupper:9.0.19'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The JUnit tests run on a plain JVM, with no Minecraft on their classpath: they test the rules
// that read no game state, and the game tests test the rest. A Library whose rules need game types
// adds `addModdingDependenciesTo sourceSets.test` to the neoForge block.
test {
    useJUnitPlatform()
}

// The jar is what players are handed, so it carries the MIT licence the Library is under.
def jarLicensing = ['LICENSE', 'LICENSES/MIT.txt']
tasks.named('jar', Jar) {
    from(rootDir) { include jarLicensing }
}

// Fails the build when the jar lost its licensing.
def checkJarLicensing = tasks.register('checkJarLicensing') {
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file jarFile
    doLast {
        def names = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip -> zip.entries()*.name as Set }
        def missing = jarLicensing.findAll { !names.contains(it) }
        if (missing) throw new GradleException("${jarFile.get().asFile.name} lacks its licensing: ${missing.join(', ')}")
    }
}
tasks.named('check') { dependsOn checkJarLicensing }

// neoforge.mods.toml names nothing of its own: it is filled from gradle.properties.
def modProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, version: mod_version,
        minecraft_version: minecraft_version, neoforge_version: neoforge_version,
        groundworks_version: groundworks_version, libworks_runtime_version: libworks_runtime_version,
]
processResources {
    inputs.properties modProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modProperties
    }
}

// Maven local only, which is where a Consumer's development build and the Pack's pin read the
// Library's jar (release-train). Nothing here publishes anywhere else.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// A version in the local maven repository never changes: Consumers resolve it by version and the
// Pack pins its sha256, so a fix is the next patch version (docs/agents/releases.md). Gradle's own
// mavenLocal() says where that is, and it's removed again so nothing resolves from it.
tasks.withType(PublishToMavenLocal).configureEach {
    def local = repositories.mavenLocal()
    repositories.remove(local)
    def published = new File(local.url.path, "${maven_group.replace('.', '/')}/$archives_name/$mod_version")
    doFirst {
        if (published.exists()) throw new GradleException(
                "$mod_name $mod_version is already in $published, and a published version never changes: bump mod_version")
    }
}

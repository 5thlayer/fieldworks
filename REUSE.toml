version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".gitmodules",
    "**/*.mods.toml",
    "scripts/*.py",
    "scripts/*.sh",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/gametest/resources/**/*.json",
    "src/gametest/resources/**/*.mcmeta",
    "src/main/resources/**/*.nbt",
    "src/gametest/resources/**/*.nbt",
    "src/main/resources/gallery_pack/**",
    "src/test/resources/**/*.json",
    "LICENSE",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
    "src/main/resources/assets/fieldworks/textures/block/ore/stone_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/tar.png",
    "src/main/resources/assets/fieldworks/textures/item/tar.png",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"


version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitmodules",
    "**/*.mods.toml",
    "scripts/*.py",
    "scripts/*.sh",
    "**/*.md",
    "src/main/resources/**/*.json",
    "src/main/resources/**/*.nbt",
    "src/main/resources/gametest_pack/pack.mcmeta",
    "src/test/resources/**/*.json",
    "LICENSE",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
    "src/main/resources/assets/fieldworks/textures/block/ore/stone_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/tar.png",
    "src/main/resources/assets/fieldworks/textures/item/tar.png",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Malcolm Riley's unused textures: the coal, copper, iron, sulfur and uranium ore sprites, the item
# sprites and the crude oil sprite, with the unmodified copies the ore and item sprites are built
# from (NOTICE).
[[annotations]]
path = [
    "data/art/ore_*.png",
    "data/art/material_crystal_sulfur_fancy.png",
    "data/art/material_crystal_greenish.png",
    "data/art/ingot_lead.png",
    "src/main/resources/assets/fieldworks/textures/block/ore/coal_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/ore/copper_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/ore/iron_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/ore/sulfur_stage*.png",
    "src/main/resources/assets/fieldworks/textures/block/ore/uranium_stage*.png",
    "src/main/resources/assets/fieldworks/textures/item/sulfur.png",
    "src/main/resources/assets/fieldworks/textures/item/raw_uranium.png",
    "src/main/resources/assets/fieldworks/textures/item/uranium_ingot.png",
    "src/main/resources/assets/fieldworks/textures/block/fluid/crude_oil.png",
    "src/main/resources/assets/fieldworks/textures/block/fluid/crude_oil.png.mcmeta",
]
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# Temporary cover and icon for mod pages, drawn from the ore sprites.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"
